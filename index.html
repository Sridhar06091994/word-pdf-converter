<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word ↔ PDF Converter</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: #fff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      max-width: 440px;
      width: 100%;
    }
    h1 { margin-top: 0; font-size: 1.5rem; }
    select, input[type="file"], button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
      box-sizing: border-box;
    }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { background: #93c5fd; cursor: not-allowed; }
    .note { font-size: 0.85rem; color: #555; margin-top: 14px; }
    #status { margin-top: 14px; font-weight: 500; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Word ↔ PDF Converter</h1>
    <label for="mode">Conversion Direction</label>
    <select id="mode">
      <option value="word-to-pdf">Word (.doc / .docx) → PDF</option>
      <option value="pdf-to-word">PDF (.pdf) → Word (.docx)</option>
    </select>

    <input type="file" id="fileInput" accept=".doc,.docx,.pdf" />
    <button id="convertBtn" onclick="convertFile()">Convert & Download</button>

    <div id="status"></div>
    <p class="note">Max size: 10 MB. Uploaded files are deleted immediately after conversion.</p>
  </div>

  <script>
    async function convertFile() {
      const mode = document.getElementById("mode").value;
      const fileInput = document.getElementById("fileInput");
      const status = document.getElementById("status");
      const btn = document.getElementById("convertBtn");

      if (!fileInput.files.length) {
        status.textContent = "Please choose a file first.";
        return;
      }

      const file = fileInput.files[0];
      const formData = new FormData();
      formData.append("file", file);

      btn.disabled = true;
      status.textContent = "Converting... please wait.";

      try {
        const res = await fetch(`/convert/${mode}`, {
          method: "POST",
          body: formData,
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.detail || "Conversion failed.");
        }

        const blob = await res.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        const baseName = file.name.replace(/\.[^/.]+$/, "");
        a.href = url;
        a.download = mode === "word-to-pdf" ? `${baseName}.pdf` : `${baseName}.docx`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(url);

        status.textContent = "Done! Your download has started.";
      } catch (err) {
        status.textContent = "Error: " + err.message;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
